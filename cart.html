<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NYX Perfumes — Carrito</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    try {
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    // Routed through the same CSS custom properties as index.html (defined
                    // in style.css under :root for dark / body.light-mode for light) so
                    // this page follows the shared theme instead of always being dark.
                    colors: {
                        "on-tertiary-fixed-variant": "var(--nyx-on-tertiary-fixed-variant)",
                        "surface-container-highest": "var(--nyx-surface-container-highest)",
                        "on-error": "var(--nyx-on-error)",
                        "surface-dim": "var(--nyx-surface-dim)",
                        "outline-variant": "var(--nyx-outline-variant)",
                        "surface-container-lowest": "var(--nyx-surface-container-lowest)",
                        "outline": "var(--nyx-outline)",
                        "on-tertiary-fixed": "var(--nyx-on-tertiary-fixed)",
                        "on-secondary-fixed": "var(--nyx-on-secondary-fixed)",
                        "on-primary": "var(--nyx-on-primary)",
                        "surface-bright": "var(--nyx-surface-bright)",
                        "on-secondary": "var(--nyx-on-secondary)",
                        "secondary-fixed-dim": "var(--nyx-secondary-fixed-dim)",
                        "on-tertiary": "var(--nyx-on-tertiary)",
                        "surface": "var(--nyx-surface)",
                        "tertiary": "var(--nyx-tertiary)",
                        "surface-container": "var(--nyx-surface-container)",
                        "tertiary-fixed-dim": "var(--nyx-tertiary-fixed-dim)",
                        "secondary-fixed": "var(--nyx-secondary-fixed)",
                        "primary": "var(--nyx-primary)",
                        "on-primary-fixed": "var(--nyx-on-primary-fixed)",
                        "error-container": "var(--nyx-error-container)",
                        "surface-variant": "var(--nyx-surface-variant)",
                        "secondary": "var(--nyx-secondary)",
                        "surface-container-high": "var(--nyx-surface-container-high)",
                        "on-tertiary-container": "var(--nyx-on-tertiary-container)",
                        "on-primary-fixed-variant": "var(--nyx-on-primary-fixed-variant)",
                        "background": "var(--nyx-background)",
                        "on-background": "var(--nyx-on-background)",
                        "primary-container": "var(--nyx-primary-container)",
                        "on-surface": "var(--nyx-on-surface)",
                        "surface-container-low": "var(--nyx-surface-container-low)",
                        "primary-fixed-dim": "var(--nyx-primary-fixed-dim)",
                        "on-primary-container": "var(--nyx-on-primary-container)",
                        "on-surface-variant": "var(--nyx-on-surface-variant)",
                        "on-secondary-container": "var(--nyx-on-secondary-container)",
                        "primary-fixed": "var(--nyx-primary-fixed)",
                        "on-secondary-fixed-variant": "var(--nyx-on-secondary-fixed-variant)",
                        "surface-tint": "var(--nyx-surface-tint)",
                        "inverse-on-surface": "var(--nyx-inverse-on-surface)",
                        "inverse-primary": "var(--nyx-inverse-primary)",
                        "tertiary-container": "var(--nyx-tertiary-container)",
                        "tertiary-fixed": "var(--nyx-tertiary-fixed)",
                        "secondary-container": "var(--nyx-secondary-container)",
                        "inverse-surface": "var(--nyx-inverse-surface)",
                        "error": "var(--nyx-error)",
                        "on-error-container": "var(--nyx-on-error-container)"
                    },
                    borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
                    spacing: { gutter: "24px", "margin-desktop": "80px", unit: "8px", "container-max": "1440px", "margin-mobile": "20px" },
                    fontFamily: {
                        "title-md": ["Manrope"],
                        "display-lg": ["Bodoni Moda"],
                        "headline-lg-mobile": ["Bodoni Moda"],
                        "body-md": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-lg": ["Bodoni Moda"],
                        "label-sm": ["Manrope"]
                    },
                    fontSize: {
                        "title-md": ["20px", { lineHeight: "28px", letterSpacing: "0.1em", fontWeight: "300" }],
                        "display-lg": ["72px", { lineHeight: "80px", letterSpacing: "0.05em", fontWeight: "400" }],
                        "headline-lg-mobile": ["32px", { lineHeight: "40px", letterSpacing: "0.03em", fontWeight: "400" }],
                        "body-md": ["16px", { lineHeight: "24px", letterSpacing: "0.01em", fontWeight: "300" }],
                        "body-lg": ["18px", { lineHeight: "30px", letterSpacing: "0.01em", fontWeight: "300" }],
                        "headline-lg": ["48px", { lineHeight: "56px", letterSpacing: "0.03em", fontWeight: "400" }],
                        "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.15em", fontWeight: "500" }]
                    }
                }
            }
        };
    } catch (_e) {}
</script>
</head>
<body class="font-body-md bg-background text-on-background">
<script>
    // Applies the theme saved from index.html's toggle before the page paints, so this
    // page always matches whatever mode the rest of the site is currently in.
    try {
        if (localStorage.getItem("nyxTheme") === "light") {
            document.body.classList.add("light-mode");
        }
    } catch (_e) {}
</script>

<header class="fixed top-0 w-full bg-transparent backdrop-blur-md z-50 border-b border-white/5">
<nav class="flex items-center gap-4 w-full px-5 md:px-8 py-5 max-w-container-max mx-auto">
<a href="index.html" class="text-on-surface p-2 -ml-2" aria-label="Volver">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-display-lg text-xl tracking-[0.15em] uppercase">Carrito</h1>
</nav>
</header>

<main class="pt-32 pb-24 px-margin-mobile max-w-3xl mx-auto min-h-screen">

<div id="cartItems" class="space-y-4 mb-10"></div>
<p id="cartEmptyState" class="hidden text-center text-on-surface-variant py-20 font-light">
Tu carrito está vacío.<br/>
<a href="index.html" class="text-primary underline underline-offset-4 mt-2 inline-block">Explorar el catálogo</a>
</p>

<div id="cartSummary" class="hidden border-t border-white/10 pt-6 space-y-5">
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Total</span>
<span id="totalAmount" class="font-display-lg text-2xl text-on-surface"></span>
</div>
<button id="encargarBtn" class="w-full py-5 rounded-full bg-primary text-on-primary font-title-md uppercase tracking-widest text-sm hover:opacity-90 transition-opacity">
Encargar
</button>
<button id="clearCartBtn" class="w-full py-3 text-center text-xs text-on-surface-variant uppercase tracking-widest hover:text-red-300 transition-colors">
Vaciar carrito
</button>
</div>

</main>

<script src="cart-utils.js"></script>
<script src="cart.js"></script>
</body>
</html>
